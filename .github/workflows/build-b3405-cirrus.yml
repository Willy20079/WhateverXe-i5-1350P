name: Build B3405CVA Cirrus Audio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Fetch pinned source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git init cirrus
          git -C cirrus fetch --depth 1 https://github.com/hoaug-tran/CirrusAudioFixup.git 8b5cad5454e8a9d420c866406ce421b256dab343
          git -C cirrus checkout --detach FETCH_HEAD
          git init cirrus/MacKernelSDK
          git -C cirrus/MacKernelSDK fetch --depth 1 https://github.com/acidanthera/MacKernelSDK.git 7af1933c27aefcbdf4809ee44478829aad30f9c1
          git -C cirrus/MacKernelSDK checkout --detach FETCH_HEAD
          git init cirrus/Lilu
          git -C cirrus/Lilu fetch --depth 1 https://github.com/acidanthera/Lilu.git e4748cc081bf060302c7d3c44a643ce1d11b7e1d
          git -C cirrus/Lilu checkout --detach FETCH_HEAD
      - name: Import exact B3405CVA firmware and add board replay
        working-directory: cirrus
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, pathlib, subprocess, zlib
          assets = json.loads(r'''
          {
            "cs35l41-dsp1-spk-prot-10431294.wmfw": {
              "sha256": "e4e73d47203e0badc913b4a1317d48cb0e1b54d7d737f339148068f0cde34b16",
              "zlib_base64": ""
            },
            "cs35l41-dsp1-spk-prot-10431294-spkid1-l0.bin": {
              "sha256": "bf7a5b7402090768006a63840ffd2300f2324b759621d4f9a9d24739e3a4e7f1",
              "zlib_base64": ""
            },
            "cs35l41-dsp1-spk-prot-10431294-spkid1-r0.bin": {
              "sha256": "d16a25cd48fc9c521d59e1ff126d09b92bb37abc1dd992f477c4cd7aa7a958de",
              "zlib_base64": ""
            }
          }
          ''')
          out = pathlib.Path("b3405-firmware")
          out.mkdir(exist_ok=True)
          for name, asset in assets.items():
              data = zlib.decompress(base64.b64decode(asset["zlib_base64"]))
              assert hashlib.sha256(data).hexdigest() == asset["sha256"], name
              (out/name).write_bytes(data)
              print(name, len(data), asset["sha256"])
          subprocess.run([
              "python3", "Tools/Firmware/import_firmware.py", "--codec", "cs35l41",
              "--ssid", "10431294", "--spkid", "1",
              "--wmfw", str(out/"cs35l41-dsp1-spk-prot-10431294.wmfw"),
              "--bin-l", str(out/"cs35l41-dsp1-spk-prot-10431294-spkid1-l0.bin"),
              "--bin-r", str(out/"cs35l41-dsp1-spk-prot-10431294-spkid1-r0.bin"),
          ], check=True)
          p = pathlib.Path("Tests/Platform/check_machine_matrix.py")
          source = p.read_text()
          anchor = " const Board boards[]{\n"
          assert source.count(anchor) == 1
          row = '  {"ASUS B3405CVA 10431294 speaker 1 / collected SPI metadata",0x1043,0x1294,1,0,core::BusTransportType::SPI},\n'
          p.write_text(source.replace(anchor, anchor+row))
          pathlib.Path("B3405-firmware-hashes.json").write_text(json.dumps({n:a["sha256"] for n,a in assets.items()},indent=2))
          PYTHON
      - name: Build and validate Debug and Release
        working-directory: cirrus
        shell: bash
        run: |
          set -euo pipefail
          if ! bash Tools/Build/build_macos.sh > build.log 2>&1; then
            tail -n 160 build.log
            exit 1
          fi
          tail -n 60 build.log
          git diff --stat
          git diff -- Tests/Platform/check_machine_matrix.py > B3405-replay.patch
          mkdir -p dist
          cp LICENSE LICENSE.cirrus B3405-firmware-hashes.json B3405-replay.patch dist/
          for MODE in Debug Release; do
            ditto -c -k --keepParent "build/Local-$MODE/CirrusAudioFixup.kext" "dist/CirrusAudioFixup-B3405CVA-$MODE.zip"
            ditto -c -k --keepParent "build/Local-$MODE/CirrusAudioFixup.kext.dSYM" "dist/CirrusAudioFixup-B3405CVA-$MODE-dSYM.zip"
          done
          shasum -a 256 dist/*.zip > dist/SHA256SUMS.txt
      - name: Upload B3405CVA builds and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B3405CVA-Cirrus-Custom
          path: |
            cirrus/dist/
            cirrus/build.log
          if-no-files-found: error
          retention-days: 14
