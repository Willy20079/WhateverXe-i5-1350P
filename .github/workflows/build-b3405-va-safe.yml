name: Build B3405CVA VA Safe
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
    - name: Checkout fixed baseline
      uses: actions/checkout@v4
      with:
        repository: Willy20079/WhateverXe-i5-1350P
        ref: a40f80a9b0031c40d5b82b6a277986111c88985c
        path: source
        persist-credentials: false
    - name: Checkout kernel headers
      uses: actions/checkout@v4
      with:
        repository: acidanthera/MacKernelSDK
        ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
        path: source/MacKernelSDK
        persist-credentials: false
    - name: Checkout Lilu headers
      uses: actions/checkout@v4
      with:
        repository: acidanthera/Lilu
        ref: e4748cc081bf060302c7d3c44a643ce1d11b7e1d
        path: dependencies/Lilu
        persist-credentials: false
    - name: Apply exact source overlay
      shell: bash
      run: |
        python3 - <<'PY'
        import base64,hashlib,io,zipfile
        payload=base64.b64decode("")
        assert hashlib.sha256(payload).hexdigest()=="9a55181e4134eded05585d207e40f54bc7ea60ddd4ff157b4e0e7049f4b3d89a"
        with zipfile.ZipFile(io.BytesIO(payload)) as z:
            assert all(not p.startswith("/") and ".." not in p.split("/") for p in z.namelist())
            z.extractall("source")
        PY
    - name: Prepare dependencies
      shell: bash
      run: |
        mkdir -p Lilu.kext/Contents/Resources build/logs build/b3405-stubs/Headers build/b3405-stubs/sys
        ln -s "$GITHUB_WORKSPACE/dependencies/Lilu/Lilu/Headers" Lilu.kext/Contents/Resources/Headers
        ln -s "$GITHUB_WORKSPACE/dependencies/Lilu/Lilu/Library" Lilu.kext/Contents/Resources/Library
        touch build/b3405-stubs/Headers/kern_mach.hpp build/b3405-stubs/sys/vnode.h
      working-directory: source
    - name: CPU regression checks
      shell: bash
      run: |
        set -o pipefail
        python3 tools/test.py 2>&1 | tee build/logs/cpu-tests.log
        clang++ -std=c++17 -g -fsanitize=address,undefined -Ibuild/b3405-stubs -IWhateverXe tests/b3405_hook_fixture.cpp -o build/b3405-callback-test
        ./build/b3405-callback-test 2>&1 | tee build/logs/callback-tests.log
      working-directory: source
    - name: Build with native Apple toolchain
      shell: bash
      run: |
        set -o pipefail
        python3 tools/build.py --output build/DEBUG 2>&1 | tee build/logs/build-debug.log
        python3 tools/build.py --output build/RELEASE --release 2>&1 | tee build/logs/build-release.log
        python3 - <<'PY'
        from pathlib import Path
        import struct,hashlib,json
        result={}
        for config in ['DEBUG','RELEASE']:
            p=Path('build')/config/'WhateverXe.kext/Contents/MacOS/WhateverXe'
            data=p.read_bytes()
            header=struct.unpack_from('<8I',data)
            assert header[0]==0xfeedfacf and header[1]==0x01000007 and header[3]==11, (p,header)
            result[config]={'sha256':hashlib.sha256(data).hexdigest(),'file_type':'MH_KEXT_BUNDLE'}
        Path('build/NATIVE-BUILD-VALIDATION.json').write_text(json.dumps(result,indent=2)+'\n')
        PY
      working-directory: source
    - name: Upload compiled test drivers
      uses: actions/upload-artifact@v4
      with:
        name: B3405CVA-VA-Safe-Build
        retention-days: 7
        path: |-
          source/build/DEBUG/WhateverXe.kext
          source/build/RELEASE/WhateverXe.kext
          source/build/DEBUG/build-manifest.json
          source/build/RELEASE/build-manifest.json
          source/build/DEBUG/boot-stack.json
          source/build/RELEASE/boot-stack.json
          source/build/NATIVE-BUILD-VALIDATION.json
          source/docs/experimental-va.md
    - name: Upload logs even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: B3405CVA-VA-Safe-Logs
        retention-days: 7
        if-no-files-found: ignore
        path: |-
          source/build/logs
          source/build/tests/*.log
          source/build/tests/results.json
